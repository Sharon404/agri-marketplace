<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agri Marketplace - Agricultural Trading Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Agri Marketplace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Agri Marketplace</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
    }
    
    #app-container {
      width: 100%;
      height: 100%;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="app-container" class="loading">
    Loading Agri Marketplace...
  </div>
  
  <script>
    // Configure Flutter for HTML rendering
    window._dartIsHtmlRuntime = true;
    if (window.location.search.indexOf('use-skia=false') === -1) {
      // Use HTML renderer instead of CanvasKit to avoid CDN dependencies
      window.flutterCanvasKitUrl = null;
    }
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
