services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agri-backend-app:latest
    container_name: agri-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/vendor:/var/www/html/vendor
      - ./backend/node_modules:/var/www/html/node_modules
    expose:
      - "9000"
    environment:
      APP_ENV: local
      APP_DEBUG: '1'
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: agri
      DB_USERNAME: agri
      DB_PASSWORD: secret
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: agri-web-server
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:8000"
    depends_on:
      - app

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: agri
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    image: agri-frontend:latest
    container_name: agri-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
